<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="icor">Cor: </label>
            <input type="color" name="cor" id="icor" value="#0000ff">
        </p>
        <p>
            <label for="irange">Nivel de satisfação:</label>
            <input type="range" name="range" id="irange" min="1" max="5" value="1">
        </p>
        <p>
            <label for="ifile">Foto de perfil:</label>
            <input type="file" name="file" id="ifile"><!--para envios de arquivo deve-se usar o método post-->
        </p>
        <p> 
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
