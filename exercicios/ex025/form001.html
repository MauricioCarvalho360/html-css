    <title>Formulários</title>

        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>

<body>
    <h1>Meu primeiro formulário</h1>
    <form autocomplete="off" action="cadastro.php"><!--tira as sugestões-->
        <p><label for="inome">Nome: </label>
            <input type="text" name="nome " id="inome"><!-- em php e nescessário que todo abjeto de entrada tenha um name, já em javascript e no label o mais importante é o id-->
            <!--o label e muito util para celulares pois ele aumenta a area de contato pois e como se a palavra nome fosse a caixa de dialogo-->
        </p>
        <p><label for="isobrenome">Sobrenome: </label>
            <input type="text" name="sobrenome" id="isobrenome">
        </p>
        <p><input type="submit" value="Enviar"></p>
    </form>
