<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de formulario</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form autocomplete="on" action="cadastro.php" method="post">
        <p>
            <label for="iusu">Usuario: </label>
            <input type="text" name="usu" id="iusu" required minlength="5" size="10" placeholder="nome de usuario" autocomplete="username"><!--O required é o campo obrigatório, se ele não estiver preenchido não envia-->
        </p>
        <p>
            <label for="isen">Senha :</label>
            <input type="password" name="sen" id="isen" required minlength="8" maxlength="15" size="8" placeholder="minimo 8 letras" autocomplete="current-password"><!--minlingth é a quantidade mínima,maxlength é a máxima-->
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
